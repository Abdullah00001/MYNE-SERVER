services:
  redis:
    image: redis:7.2-alpine
    container_name: myne_redis_container
    command: redis-server --requirepass ${REDIS_PASSWORD:-myStrongRedisPassword}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6387}:6379"
    networks:
      - myne_backend_network
    volumes:
      - myne_redis_volume:/data

  server:
    build:
      context: ./backend-server
      dockerfile: Dockerfile
    container_name: myne_server_container
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5022}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
    env_file:
      - ./backend-server/.env
    networks:
      - myne_backend_network
    depends_on:
      - redis

  ai_server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: myne_ai_server_container
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8022}:8000"
    environment:
      ENV: prod
      PORT: 8000
    env_file:
      - ./ai-server/.env
    networks:
      - myne_backend_network
    depends_on:
      - redis

networks:
  myne_backend_network:
    name: myne_backend_network
    driver: bridge

volumes:
  myne_redis_volume:

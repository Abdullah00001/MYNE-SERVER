name: Deploy to VPS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Backend .env
        run: |
          echo "${{ secrets.ENV_BACKEND }}" > backend-server/.env

      - name: Create AI .env
        run: |
          echo "${{ secrets.ENV_AI }}" > ai-server/.env

      - name: Copy files to VPS via rsync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.VPS_USERNAME }}/MYNE-SERVER"
          exclude: ".git,node_modules,dist,.venv"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/MYNE-SERVER
            docker compose down
            docker compose up -d --build

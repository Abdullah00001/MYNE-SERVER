name: Deploy to VPS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Secrets
        run: |
          echo "VPS_USER=$(echo '${{ secrets.VPS_USERNAME }}' | tr -d '\n\r')" >> $GITHUB_ENV
          echo "VPS_HOST=$(echo '${{ secrets.VPS_HOST }}' | tr -d '\n\r')" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pull Latest Code and Deploy
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "
            cd /home/${{ env.VPS_USER }}/MYNE-SERVER && \
            git fetch origin main && \
            git reset --hard origin/main && \
            echo '${{ secrets.ENV_BACKEND }}' > backend-server/.env && \
            echo '${{ secrets.ENV_AI }}' > ai-server/.env && \
            docker compose down && \
            docker compose up -d --build
          "
